# Dark theme from the project palette (dark-mode values). Chart colors are the palette's
# rain / night / bolt hues re-stepped to OKLCH L 0.48–0.67, C≥0.10 so they read on #141A2A and
# pass color-blind separation checks; the light UI tones are too light for chart marks.

[theme]
base = "dark"
primaryColor = "#8C9FE0"             # --night
backgroundColor = "#141A2A"          # --page
secondaryBackgroundColor = "#1C2238" # --night-surface
textColor = "#E2E7F0"                # --text
linkColor = "#7FDBFF"                # --rain-strong
borderColor = "#3E4760"              # --line
dataframeBorderColor = "#3E4760"
dataframeHeaderBackgroundColor = "#1C2238"
showWidgetBorder = true
baseRadius = "0.5rem"

blueColor = "#5CC8F0"                # info callouts → rain
blueBackgroundColor = "#12263A"
blueTextColor = "#7FDBFF"
violetColor = "#8C9FE0"
greenColor = "#5CC8F0"               # positive deltas → rain
greenBackgroundColor = "#12263A"
greenTextColor = "#7FDBFF"
redColor = "#FF8A80"                 # negative deltas → coral
redBackgroundColor = "#2E1C22"
redTextColor = "#FFA59C"
orangeColor = "#FF8A80"              # warnings → coral
orangeBackgroundColor = "#2E1C22"
orangeTextColor = "#FFA59C"
yellowColor = "#F2DE5C"              # → bolt
yellowBackgroundColor = "#24221A"
yellowTextColor = "#FFEB6B"
grayColor = "#A6AEC2"                # --text-muted
grayTextColor = "#A6AEC2"

chartCategoricalColors = ["#05A0CF", "#736EE1", "#B39105"]
# Rain, dark → light (more = brighter on a dark surface). Streamlit requires exactly 10.
chartSequentialColors = ["#104F81", "#176396", "#1C77AC", "#238BC1", "#2BA0D6", "#32B6EB", "#51CBF9", "#8BDDFB", "#BDEDFD", "#F0FBFE"]

[theme.sidebar]
backgroundColor = "#1C2238"          # --night-surface
secondaryBackgroundColor = "#141A2A"

[client]
toolbarMode = "viewer"  # hide the Deploy button and developer menu
