name: Deploy

# One workflow, two targets (openspec/specs/preview-deploy and production-deploy):
# - a pull request from this repo is built and deployed as a preview: the dev environment, Neon `dev` data,
#   locked to the owner's Vercel team;
# - a push to main, 03:00 UTC every night, or a hand-started run on main is built and deployed as production:
#   Neon `prod` data. A production build is staged first (--skip-domain, visitors still get the old one), checked,
#   and only then promoted to rain.storyandstructure.studio. A failed check leaves the live site untouched.
# The nightly run is what puts new plays on the site: the sync's pushes use the default token, which does not start
# other workflows.
#
# The project has no Git connection on purpose (infra/vercel.tf), so nothing deploys except this workflow.

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

# A pull request cancels its own older run. Production runs queue and are never cut off halfway; GitHub keeps one
# waiting run, which builds main as it is when it starts.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('deploy-{0}', github.event.pull_request.number) || 'deploy-production' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  VERCEL_CLI: vercel@64.7.0 # pinned; bump on purpose
  TARGET: ${{ github.event_name == 'pull_request' && 'preview' || 'production' }}
  # Written by infra/github.tf. Not secrets, but not worth guessing either.
  VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}

jobs:
  deploy:
    # Fork and Dependabot pull requests get no secrets, so they get no deploy and no failure. Anything that is not a
    # pull request must be on main, so a hand-started run on another branch cannot reach production.
    if: >-
      (github.event_name == 'pull_request'
        && github.event.pull_request.head.repo.full_name == github.repository
        && github.actor != 'dependabot[bot]')
      || (github.event_name != 'pull_request' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      # The same two commands the nightly sync uses, so the preview serves what the Mac would.
      - name: Build the full database, then the two-year copy
        run: |
          uv run --no-default-groups rain-in-my-head build
          uv run --no-default-groups rain-in-my-head publish

      # The window is 730 days ending 7 days ago (specs/009-public-dataset), so the oldest play is 737.0 days old.
      # One day of margin, so rounding never fails a run (a nightly deploy can't stop for that).
      - name: Check the two-year window
        run: |
          python3 - <<'PY'
          import sqlite3, time
          oldest, plays = sqlite3.connect("data/public.db").execute("select min(played_at), count(*) from scrobbles").fetchone()
          days = (time.time() - oldest) / 86400
          print(f"{plays:,} plays; the oldest is {days:.1f} days old")
          assert days <= 738, "public.db holds a play older than the 730-day window plus the 7-day lag plus a day of margin"
          PY

      - name: Build the frontend
        working-directory: web
        run: |
          npm ci
          npm run build

      # Vercel installs from requirements.txt. It is made from pyproject.toml here so there is one list, not two.
      # The project's own httpx and python-dotenv stay in; the Streamlit group stays out.
      - name: List the API's Python packages
        run: uv export --no-default-groups --group web --no-dev --no-hashes --no-emit-project --no-header --no-annotate -o requirements.txt

      - name: Fetch the ${{ env.TARGET }} settings from Vercel
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_API_TOKEN }}
        run: npx --yes "$VERCEL_CLI" pull --yes --environment="$TARGET"

      - name: Build for Vercel
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_API_TOKEN }}
        run: |
          if [ "$TARGET" = production ]; then npx --yes "$VERCEL_CLI" build --prod; else npx --yes "$VERCEL_CLI" build; fi

      # Runs before the deploy, so a bundle that holds raw data stops the run instead of going live.
      - name: Check what the function bundle holds
        run: |
          # The build folder holds only the handler and its config. The app's own files are named in
          # .vc-config.json (filePathMap) and uploaded from the repo at deploy time, so read both lists.
          find -L .vercel/output/functions -type f | sed 's|^\.vercel/output/functions/||' > bundle-files.txt
          for cfg in $(find .vercel/output/functions -name .vc-config.json); do
            echo "$cfg: top-level fields and how many entries each holds (values are not printed)"
            jq -c 'del(.environment) | with_entries(.value |= (if type=="object" or type=="array" then length else "scalar" end))' "$cfg"
            jq -r '(.filePathMap // {}) | keys[]' "$cfg" >> bundle-files.txt
          done
          sort -u -o bundle-files.txt bundle-files.txt
          echo "$(wc -l < bundle-files.txt) files in the bundle, by top-level folder:"
          cut -d/ -f1 bundle-files.txt | sort | uniq -c | sort -rn | head -n 15
          echo "The files outside the packages:"
          grep -vE '^_vendor/|site-packages|\.dist-info' bundle-files.txt | head -n 80
          grep -q 'data/public\.db$' bundle-files.txt || { echo "data/public.db is missing from the bundle"; exit 1; }
          grep -q 'src/rain_in_my_head/' bundle-files.txt || { echo "src/rain_in_my_head is missing from the bundle"; exit 1; }
          if grep -nE '(^|/)(data/raw|data/cache|infra|\.claude|\.specify)/|(^|/)\.env$|(^|/)data/listening\.db' bundle-files.txt; then
            echo "The bundle holds a path that must stay out of it"; exit 1
          fi
          echo "Clean: public.db and the package are in; data/raw, data/cache and infra are out"

      # Production is staged: --skip-domain builds it with the production settings but leaves the live address on the
      # old deployment until the promote step below.
      - name: Deploy the ${{ env.TARGET }} build
        id: deploy
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_API_TOKEN }}
        run: |
          if [ "$TARGET" = production ]; then
            url=$(npx --yes "$VERCEL_CLI" deploy --prebuilt --prod --skip-domain)
          else
            url=$(npx --yes "$VERCEL_CLI" deploy --prebuilt)
          fi
          echo "url=$url" >> "$GITHUB_OUTPUT"

      # `vercel curl` gets through the deployment's login protection itself, so no bypass secret is stored. The script
      # prints status codes and a verdict only, never a body or a header.
      - name: Check the deployment answers
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_API_TOKEN }}
          URL: ${{ steps.deploy.outputs.url }}
        run: .github/scripts/check-deployment.sh "$URL"

      - name: Make it the live site
        if: env.TARGET == 'production'
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_API_TOKEN }}
          URL: ${{ steps.deploy.outputs.url }}
        run: npx --yes "$VERCEL_CLI" promote "$URL" --yes

      # One comment per pull request, found by its hidden marker so the infrastructure plan comment is left alone.
      - name: Put the preview address on the pull request
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          URL: ${{ steps.deploy.outputs.url }}
          SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          {
            echo "<!-- preview-deploy -->"
            echo "### Preview"
            echo
            echo "$URL"
            echo
            echo "Opens only for people logged in to the owner's Vercel team. It reads and writes visitor data on the Neon \`dev\` branch."
            echo
            echo "Commit \`${SHA:0:7}\`"
          } > comment.md
          id=$(gh api "repos/$GITHUB_REPOSITORY/issues/$PR/comments" --paginate \
            --jq '.[] | select(.body | contains("<!-- preview-deploy -->")) | .id' | head -n1)
          if [ -n "$id" ]; then
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$id" -F body=@comment.md > /dev/null
          else
            gh api "repos/$GITHUB_REPOSITORY/issues/$PR/comments" -F body=@comment.md > /dev/null
          fi
