name: Sync scrobbles

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6

      - name: Fetch new scrobbles from Last.fm
        run: uv run --no-default-groups rain-in-my-head fetch
        env:
          LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
          LASTFM_USER: ${{ secrets.LASTFM_USER }}

      - name: Build database
        run: uv run --no-default-groups rain-in-my-head build

      # A Last.fm failure here must not lose the scrobbles fetched above: lookups already
      # appended to data/cache/ are committed either way, and the next run picks up the rest.
      - name: Enrich new tracks and artists
        continue-on-error: true
        run: uv run --no-default-groups rain-in-my-head enrich --limit 100 --write-cache
        env:
          LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
          LASTFM_USER: ${{ secrets.LASTFM_USER }}

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/raw/lastfm data/cache
          if git diff --cached --quiet; then
            echo "No new scrobbles or lookups."
          else
            message="Sync scrobbles"
            git diff --cached --quiet -- data/cache || message="Sync scrobbles and lookups"
            git commit -m "$message $(date -u +%Y-%m-%dT%H:%MZ)"
            git push
          fi
