name: Analytics export

# Every night: delete usage records older than 12 months, then copy the rest to the private `analytics` branch as
# ONE fresh commit (the older copies leave the branch's history, so the 12-month promise holds there too).
# Never touches main. Specs: specs/012-usage-tracking (research R8, R9).

on:
  schedule:
    - cron: "43 2 * * *"
  workflow_dispatch:
    inputs:
      env:
        description: "prod writes the analytics branch. dev writes analytics-dev, to try the job without touching prod's copy."
        type: choice
        options: [prod, dev]
        default: prod

permissions:
  contents: write

concurrency:
  group: analytics
  cancel-in-progress: false

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TARGET: ${{ inputs.env || 'prod' }}
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6

      # Only the owner connection for the chosen database is passed in. Neither command prints a connection
      # string, a code, an address or a row, only counts.
      - name: Delete old records and write the export
        run: |
          uv run --no-default-groups rain-in-my-head viewer prune --env "$TARGET"
          uv run --no-default-groups rain-in-my-head viewer export "$RUNNER_TEMP/out" --env "$TARGET"
        env:
          VIEWERS_OWNER_URL_PROD: ${{ inputs.env != 'dev' && secrets.NEON_PROD_OWNER_URL || '' }}
          VIEWERS_OWNER_URL_DEV: ${{ inputs.env == 'dev' && secrets.NEON_DEV_OWNER_URL || '' }}

      - name: Replace the analytics branch if the copy changed
        run: |
          branch=analytics
          [ "$TARGET" = "dev" ] && branch=analytics-dev
          .github/scripts/replace-analytics-branch.sh "$RUNNER_TEMP/out" "$branch"
