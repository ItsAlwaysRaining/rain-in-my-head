[project]
name = "rain-in-my-head"
version = "0.1.0"
description = "Personal listening analytics from Last.fm scrobbles"
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.27",
    "python-dotenv>=1.0",
]

[project.scripts]
rain-in-my-head = "rain_in_my_head.cli:main"

[dependency-groups]
dashboard = [
    "altair>=5.4",
    "pandas>=2.2",
    "streamlit>=1.40",
]
# The TypeScript dashboard's JSON API (src/rain_in_my_head/api.py); the frontend itself lives in web/.
web = [
    "fastapi>=0.143",
    "pandas>=2.2",
    "uvicorn>=0.54",
]

[tool.uv]
# `uv sync` installs both dashboards too; CI uses --no-default-groups to skip them.
default-groups = ["dashboard", "web"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rain_in_my_head"]
