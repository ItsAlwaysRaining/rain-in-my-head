[project]
name = "listening"
version = "0.1.0"
description = "Personal listening analytics from Last.fm scrobbles"
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.27",
    "python-dotenv>=1.0",
]

[project.scripts]
listening = "listening.cli:main"

[dependency-groups]
dashboard = [
    "altair>=5.4",
    "pandas>=2.2",
    "streamlit>=1.40",
]

[tool.uv]
# `uv sync` installs the dashboard too; CI uses --no-default-groups to skip it.
default-groups = ["dashboard"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/listening"]
